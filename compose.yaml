services:
  mysql:
    image: mysql:8.4
    container_name: dhruvsetu-mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Image for Polar Data Lab analysis sessions. It is only built from here:
  #   docker compose build data-lab
  # "docker compose up" does not start it. The backend starts one short-lived
  # container per session with no network access.
  data-lab:
    image: dhruvsetu-data-lab:1
    build:
      context: ./docker/data-lab
    profiles: ["data-lab"]
    network_mode: none

volumes:
  mysql_data:
